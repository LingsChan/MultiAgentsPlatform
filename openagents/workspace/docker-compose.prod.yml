name: multiagents-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/openagents_workspace
      AUTH_MODE: workspace_token
      IDENTITY_MODE: standalone
      WORKSPACE_LOCAL_AUTH_ENABLED: ${WORKSPACE_LOCAL_AUTH_ENABLED:-1}
      WORKSPACE_SESSION_SECRET: ${WORKSPACE_SESSION_SECRET:?Set WORKSPACE_SESSION_SECRET}
      FRONTEND_BASE_URL: ${WORKSPACE_URL:-http://localhost:${WORKSPACE_PORT:-8180}}
      PUBLIC_API_BASE: ${API_URL:-${WORKSPACE_URL:-http://localhost:${WORKSPACE_PORT:-8180}}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${WORKSPACE_URL:-http://localhost:${WORKSPACE_PORT:-8180}},openagents://workspace}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec", "alembic upgrade head && exec ./entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-${WORKSPACE_URL:-http://localhost:${WORKSPACE_PORT:-8180}}}
        NEXT_PUBLIC_WORKSPACE_LOCAL_AUTH: ${WORKSPACE_LOCAL_AUTH_ENABLED:-1}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${WORKSPACE_BIND:-127.0.0.1}:${WORKSPACE_PORT:-8180}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
